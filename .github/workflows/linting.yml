name: xmllint

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  lint-xml-files:
    runs-on: ubuntu-slim
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup xmllint
      uses: Bpolitycki/setup-xmllint-action@1.0.1
    - name: Lint config-clarin-clarin
      run: xmllint config-clarin-clarin.xml
    - name: Lint config-others-others
      run: xmllint config-others-others.xml
